# Perfil de PRODUCCION de ms-tallerpro-notify (SPRING_PROFILES_ACTIVE=prod).
# Se superpone a application.yml. Reglas:
#  - Los secretos NO tienen valor por defecto: si falta la variable, el arranque falla.
#  - La validacion JWT queda fija en true (no depende de TALLERPRO_JWT_ENABLED).
#  - Swagger/OpenAPI apagado y Actuator reducido a /actuator/health sin detalles.
# notify no se rutea en el gateway: solo es alcanzable dentro de la red de Docker.
spring:
  rabbitmq:
    # Ambos nodos del cluster (rabbitmq-1:5672,rabbitmq-2:5672). Si se define, Spring ignora
    # host/port y reconecta al otro nodo si uno cae.
    addresses: ${RABBITMQ_ADDRESSES}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  # SMTP: credenciales solo por variables de entorno. Si SMTP_ENABLED=false el correo
  # solo se registra en el log y estas variables pueden quedar vacias.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: ${AZURE_API_CLIENT_ID},api://${AZURE_API_CLIENT_ID}  # token v2: aud = client id pelado

tallerpro:
  security:
    # Fijo: en produccion siempre se valida el JWT de Azure AD.
    jwt-enabled: true
    # Sin roles ficticios: el usuario de desarrollo nunca debe existir en produccion.
    dev-roles: ""
  notify:
    email:
      remitente: ${SMTP_FROM}
      habilitado: ${SMTP_ENABLED}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
